name = "shelf-signal-analyst"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Pages allowed to call this Worker (comma-separated, exact origins).
ALLOWED_ORIGINS = "https://shihan-2002.github.io,http://localhost:8765"

# At most 10 questions per visitor (IP) per minute.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is NOT stored here. Set it once with:
#   npx wrangler secret put ANTHROPIC_API_KEY
